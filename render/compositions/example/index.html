<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Example Title Card</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      body { margin: 0; background: #101828; color: #ffffff; font-family: sans-serif; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden;
        background: linear-gradient(135deg, #101828 0%, #1d3557 100%); }
      .clip { position: absolute; inset: 0; display: flex; flex-direction: column;
        align-items: center; justify-content: center; }
      #bar { width: 240px; height: 8px; background: #f4a261; margin-bottom: 40px; }
      h1 { margin: 0; font-size: 120px; letter-spacing: 4px; }
      #caption { margin: 32px 0 0; font-size: 44px; color: #cbd5e1; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0"
         data-width="1920" data-height="1080" data-duration="6">
      <section id="card" class="clip" data-start="0" data-duration="6">
        <div id="bar"></div>
        <h1 id="title">Your Brand Here</h1>
        <p id="caption">Edit this caption in render/compositions/example</p>
      </section>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      tl.from("#bar", { scaleX: 0, duration: 0.8, ease: "power2.out" }, 0.2);
      tl.from("#title", { y: 60, opacity: 0, duration: 0.8, ease: "power3.out" }, 0.6);
      tl.from("#caption", { y: 30, opacity: 0, duration: 0.7, ease: "power3.out" }, 1.4);
      tl.to("#card", { opacity: 0, duration: 0.6, ease: "power1.in" }, 5.3);
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
