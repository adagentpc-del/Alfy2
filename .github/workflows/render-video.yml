name: Render video
on:
  workflow_dispatch:
    inputs:
      composition:
        description: Folder name under render/compositions/ (a-z, 0-9, hyphens)
        required: true
        default: example
permissions:
  contents: read
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Run validation tests
        run: node --test render/render.test.mjs
      - name: Render
        env:
          COMPOSITION: ${{ inputs.composition }}
        run: |
          npx --yes hyperframes@0.8.159 browser ensure
          node render/render.mjs "$COMPOSITION"
      - uses: actions/upload-artifact@v4
        with:
          name: video-${{ inputs.composition }}
          path: render/out/*.mp4
          retention-days: 7
          if-no-files-found: error
